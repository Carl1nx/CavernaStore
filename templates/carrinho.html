<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho - CavernaStore</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- CABEÇALHO / NAVBAR -->
    <header class="header">
        <div class="logo">
            <h1>Caverna<span>Store</span></h1>
        </div>
        <nav class="nav">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="#">Catálogo</a>
            <a href="{{ url_for('carrinho') }}" class="cart-btn active">Carrinho <span>(1)</span></a>
        </nav>
    </header>

    <!-- CONTEÚDO DO CARRINHO -->
    <main class="container">
        <h3 class="section-title">Seu Carrinho de Compras</h3>

        <div style="background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 2rem; text-align: center;">
            <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Seu carrinho possui 1 item selecionado.</p>
            <p style="font-size: 1.2rem; color: var(--text-color); margin-bottom: 2rem;">Total: <strong>R$ 34,90</strong></p>
            <a href="{{ url_for('home') }}" class="btn" style="max-width: 200px; margin: 0 auto;">Continuar Comprando</a>
        </div>
    </main>

    <!-- RODAPÉ -->
    <footer class="footer">
        <p>© 2026 CavernaStore - Todos os direitos reservados.</p>
    </footer>

</body>
</html>
